# ------------------------------------------------------------------
# ci.yml — the CI/CD pipeline.
#
# GitHub reads every .yml file in .github/workflows/ and runs it
# automatically on its own servers. You can watch each run in the
# "Actions" tab of your GitHub repository.
#
# Structure: a workflow contains jobs -> a job contains steps.
# If any step fails, the job stops and the run is marked red ❌.
#
# This workflow has TWO jobs:
#   1. train-test-build  (CI) — runs on every push to main and every
#                               pull request: train, test, build.
#   2. publish           (CD) — runs ONLY on pushes to main, and ONLY
#                               if job 1 passed: builds the Docker image
#                               and publishes it to the GitHub Container
#                               Registry (ghcr.io).
# ------------------------------------------------------------------

# The name shown in the Actions tab (and in the README badge).
name: ci

# "on" = WHEN to run this workflow.
on:
  push:
    branches: [main]  # pushes to the main branch only
  pull_request:       # every pull request (this also covers Dependabot's updates)

jobs:
  # ================================================================
  # JOB 1 — CI: prove the change works
  # ================================================================
  train-test-build:
    # The kind of virtual machine GitHub starts for this job.
    # It is brand new and empty every run, which proves the project
    # works from scratch, not just on your laptop.
    runs-on: ubuntu-latest

    steps:
      # "uses" runs a ready-made action from GitHub's marketplace.
      # checkout downloads your repository's code onto the machine.
      - uses: actions/checkout@v7

      # Install uv. enable-cache remembers downloaded packages between
      # runs, so later pipelines are much faster.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # "run" executes a normal shell command, exactly like your terminal.
      # uv sync reads .python-version, installs that Python, creates .venv
      # and installs the exact package versions from uv.lock.
      #   --locked  fail if uv.lock doesn't match pyproject.toml, which
      #             catches "forgot to commit the updated lock file".
      - name: Install Python and dependencies
        run: uv sync --locked

      # "uv run" runs a command inside the project's .venv.
      # If accuracy is below the quality gate, train.py exits with an
      # error and the pipeline stops here.
      - name: Train model (fails if accuracy is too low)
        run: uv run python train.py

      # Run every test in test_app.py. One failing test = red pipeline.
      - name: Run tests
        run: uv run pytest -v

      # Save the trained model and its metrics as downloadable files,
      # attached to this run (look for "Artifacts" on the run's page).
      - name: Upload model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            model.joblib
            metrics.json

      # Prove the Docker image builds successfully.
      # --build-arg passes the Python version from .python-version, so
      # Docker and CI can never disagree about it.
      # -t gives the image a name (a "tag"); "." means "use this folder".
      - name: Build Docker image
        run: >
          docker build
          --build-arg PYTHON_VERSION="$(cat .python-version)"
          -t iris-mlops-pipeline .

  # ================================================================
  # JOB 2 — CD: publish the tested image
  # ================================================================
  publish:
    # "needs" = wait for job 1 and run only if it succeeded.
    # A failed test or quality gate means nothing gets published.
    needs: train-test-build

    # Only publish from main. Pull requests are tested but never
    # published, so unreviewed code can't reach the registry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Permissions for the automatic GITHUB_TOKEN used below:
    #   contents: read    read the code
    #   packages: write   publish to the GitHub Container Registry
    # Granting only what's needed is a security best practice.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Read .python-version and save it as an output called "version",
      # so later steps can use it (single source of truth again).
      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      # Log in to the GitHub Container Registry (ghcr.io).
      # GITHUB_TOKEN is created automatically for every run, so there's
      # no password to set up or store.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Work out the image's name and tags. Every image gets two tags:
      #   latest       always points to the newest version
      #   sha-1a2b3c4  the exact commit it was built from, so you can
      #                trace any image back to its code, or roll back
      #                by running an older tag
      # It also adds labels that link the image to this repository.
      - name: Generate image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # Set up Docker Buildx, Docker's advanced build engine. The default
      # engine can't save a build cache to GitHub (the "gha" cache used
      # below), so this step is required before building.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      # Build the image and push (upload) it to the registry.
      # The gha cache reuses unchanged layers from earlier runs, so
      # rebuilds are fast.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
